<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Withdraw Money</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

</head>

<body style="background:#03a08b;background-size: 100%">
    <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
        <img src="/static/logo.png" alt="Logo" width="50" height="50" class="d-inline-block align-text-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="/welcome">TrustBank</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <div class="dropdown">
                        <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                          {{name}}
                        </button>
                        <ul class="dropdown-menu">
                          <li><a class="dropdown-item" href="/user_details">My Profile</a></li>
                        </ul>
                      </div>
                      <li class="nav-item">
                        <a class="nav-link" href="/welcome">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about">About Us</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/contact">Contact Us</a>
                </ul>
                <form action="/logout">
                    <button type="submit" class="btn btn-outline-warning">Logout</button>
                </form>
            </div>
        </div>
    </nav>
    <div class="container" style="margin-top: 50px; margin-bottom: 50px;">

        <div class="row">
            <div class="col-md-4"></div>

            <div class="col-md-4 container-fluid text-sm-center p-5 bg-light shadow-lg">
                <img src="/static/logo.png" height="90" width="90">
                <br></br>
                <h4>Withdraw Money</h4>
                <form action="/withdraw_money" name="myForm" onsubmit="return validateForm()" method="POST">
                    <div class="col-md-6 offset-md-3">
                        <label for="account" class="form-label" style="font-weight: bold"></label>
                        <select class="form-select" id="validationCustom04" name="account" required>
                            <option selected disabled value="">Select Account</option>
                            {% for account in accounts %}
                            <option value="{{ account.Account_id }}">{{ account.Account_id }} ({{ account.Type }})
                            </option>
                            {% endfor %}

                        </select>
                    </div>
                    <div class="col-md-6 offset-md-3">
                        <label for="Amount" class="form-label" style="font-weight: bold"></label>
                        <input type="number" class="form-control pin-input" id="Amount_no"
                            placeholder="Enter Amount" name="Amount" required>
                    </div>
                    <div class="col-md-6 offset-md-3">
                        <label for="acc_pin" class="form-label" style="font-weight: bold"></label>
                        <input type="password" class="form-control pin-input" id="exampleInputPassword1" placeholder="Enter Pin" name="acc_pin" required>
                        <div class="formerror" id="PinError" style="color: red;"></div>
                    </div>
                    <br>
                    <button type="submit" class="btn btn-outline-success">Withdraw</button>
                </form>
            </div>
            <div class="col-md-4"></div>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>
        <script>
            function clearErrors() {
                const errors = document.getElementsByClassName('formerror');
                for (let item of errors) {
                    item.innerHTML = "";
                }
            }
    
            function seterror(id, error) {
                document.getElementById(id).innerHTML = error;
            }
    
            function validateForm() {
                var returnval = true;
                clearErrors();
    
                //perform validation and if validation fails, set the value of returnval to false
                var pin = document.forms['myForm']["acc_pin"].value;
                if (pin.length != 4) {
                    seterror("PinError", "Pin must have 4 digits");
                    returnval = false;
                }
                if (!/^\d+$/.test(pin)) {
                    seterror("PinError", "Pin should only contain numbers");
                    returnval = false;
                }
                return returnval
            }
    
            document.getElementById('exampleInputPassword1').addEventListener('input', function () {
                if (this.value.length > 4) {
                    this.value = this.value.slice(0, 4);
                }
            });
        </script>
</body>

</html>
