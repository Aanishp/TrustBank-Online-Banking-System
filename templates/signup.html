<body style="background:#03a08b;background-size: 100%">

    <div class="container" style="margin-top: 50px; margin-bottom: 50px;">
        <div class="row">
            <div class="col-md-4"></div>

            <div class="col-md-4 container-fluid text-sm-center p-5 bg-light shadow-lg">
                <img src="/static/logo.png" height="90" width="90">
                <br></br>
                <h4>Signup To TrustBank</h4>
                <form action="/signup" name="myForm" onsubmit="return validateForm()" method="POST">
                    <div class="mb-3">
                        <label for="SSN_num" class="form-label" style="font-weight: bold">SSN</label>
                        <input type="number" class="form-control" id="SSN_num" aria-describedby="emailHelp"
                            placeholder="Enter 9-Digit SSN ID" name="SSN_num" required>
                        <div id="emailHelp" class="form-text">We'll never share your SSN with anyone else.</div>
                        <div class="formerror" id="SSNError" style="color: red;"></div>
                    </div>
                    <div class="mb-3">
                        <label for="input_first_name" class="form-label" style="font-weight: bold">First Name</label>
                        <input type="text" class="form-control" id="input_first_name"
                            placeholder="Enter Your First-Name" name="input_first_name" required>
                        <div class="formerror" id="FnameError" style="color: red;"></div>
                    </div>
                    <div class="mb-3">
                        <label for="input_last_name" class="form-label" style="font-weight: bold">Last Name</label>
                        <input type="text" class="form-control" id="input_last_name" placeholder="Enter Your Last-Name"
                            name="input_last_name" required>
                        <div class="formerror" id="LnameError" style="color: red;"></div>
                    </div>
                    <h6 style="font-weight: bold">Gender</h6>
                    <div class="form-check form-check-inline">

                        <input class="form-check-input" type="radio" name="inlineRadioOptions" id="malebox" value="Male"
                            Sex="sex" required>
                        <label class="form-check-label" for="Male">Male</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="inlineRadioOptions" id="femalebox"
                            value="Female" Sex="sex" required>
                        <label class="form-check-label" for="Female">Female</label>
                    </div>

                    <div class="mb-3">
                        <label for="Dateofbirth" class="form-label" style="font-weight: bold">DOB</label>
                        <input type="date" class="form-control" id="Dateofbirth" placeholder="Enter Your DOB"
                            name="Dateofbirth" required>
                    </div>
                    <div class="mb-3">
                        <label for="input_Address" class="form-label" style="font-weight: bold">Address</label>
                        <input type="text" class="form-control" id="input_Address" placeholder="Enter Your Address" name="input_Address" required>
                            <div class="formerror" id="address_error" style="color: red;"></div>
                    </div>
                    <div class="mb-3">
                        <label for="input_phone" class="form-label " style="font-weight: bold">Phone No.</label>
                        <input type="number" class="form-control" id="input_phone" placeholder="Enter Your PhoneNo." name="input_phone" required>
                        <div class="formerror" id="phone_error" style="color: red;"></div>
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputPassword1" class="form-label" style="font-weight: bold">Password</label>
                        <input type="password" class="form-control" id="exampleInputPassword1"
                            placeholder="Enter Password" name="exampleInputPassword1" required>
                        <div class="formerror" id="PasswordError" style="color: red;"></div>
                    </div>
                    <button type="submit" class="btn btn-outline-success">Signup</button>
                </form>
                <br>
                Already have an account? <a href="/login">Login</a>
            </div>
            <div class="col-md-4"></div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>

    <script>
        function clearErrors() {
            const errors = document.getElementsByClassName('formerror');
            for (let item of errors) {
                item.innerHTML = "";
            }
        }

        function seterror(id, error) {
            document.getElementById(id).innerHTML = error;
        }

        function validateForm() {
            var returnval = true;
            clearErrors();

            //perform validation and if validation fails, set the value of returnval to false
            var SSN = document.forms['myForm']["SSN_num"].value;
            if (SSN.length != 9) {
                seterror("SSNError", "Length of SSN should be 9 digits");
                returnval = false;
            }

            var fname = document.forms['myForm']["input_first_name"].value;
            if (fname.length < 1) {
                seterror("FnameError", "First Name should be at least 1 characters long");
                returnval = false;
            }
            if (!/^[a-zA-Z]+$/.test(fname)) {
                seterror("FnameError", "First Name should only have alphabets");
                returnval = false;
            }

            var lname = document.forms['myForm']["input_last_name"].value;
            if (fname.length < 1) {
                seterror("LnameError", "Last Name should be at least 1 characters long");
                returnval = false;
            }
            if (!/^[a-zA-Z]+$/.test(lname)) {
                seterror("LnameError", "Lirst Name should only have alphabets");
                returnval = false;
            }
            var address = document.forms['myForm']["input_phone"].value;
            if (address.length < 10) {
                seterror("address_error", "Address should atleast have 10 characters")
            }
            var phone = document.forms['myForm']["input_phone"].value;
            if (phone.length != 10) {
                seterror("phone_error", "Phone No. must have 10 digits")
            }

            var password = document.forms['myForm']["exampleInputPassword1"].value;
            if (!/[!@#$%^&*(),.?":{}|<>]/.test(password)) {
                seterror("PasswordError", "Password must contain at least one special character");
                returnval = false;
            }
            if (password.length < 6) {
                seterror("PasswordError", "Password should atleast have 6 characters");
                returnval = false;
            }
            

            return returnval;

        }

        document.getElementById('SSN_num').addEventListener('input', function () {
            if (this.value.length > 9) {
                this.value = this.value.slice(0, 9);
            }
        });

        document.getElementById('input_phone').addEventListener('input', function () {
            if (this.value.length > 10) {
                this.value = this.value.slice(0, 10);
            }
        });
    </script>
</body>
