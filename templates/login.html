<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

  <link rel="stylesheet" href="D:\My Workspace\DBMS MINI PROJECT\css\login.css">

</head>

<body style="background:#03a08b;background-size: 100%">
  <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
    <img src="/static/logo.png" alt="Logo" width="50" height="50" class="d-inline-block align-text-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">TrustBank</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/about_new">About Us</a>
        </li>
        <li class="nav-item">
            <a class="nav-link" href="/contact_us">Contact Us</a>
        </ul>
        <form action="/login">
          <button type="submit" class="btn btn-outline-success">Login</button>
        </form>

        <form action="/signup" class="d-flex ms-2">
          <button type="submit" class="btn btn-outline-warning">Signup</button>
        </form>
      </div>
    </div>
  </nav>

  <div class="container" style="margin-top: 50px;">
    <div class="row">
      <div class="col-md-4"></div>

      <div class="col-md-4 container-fluid text-sm-center p-5 bg-light shadow-lg">
        <img src="/static/logo.png" height="90" width="90">
        <br></br>
        <h4>Login To TrustBank</h4>

        <form action="/login" name="myForm" onsubmit="return validateForm()" method="POST">
          <div class="mb-3">
            <label for="SSN_num" class="form-label" style="font-weight: bold">SSN</label>
            <input type="number" class="form-control" id="number" aria-describedby="emailHelp"
              placeholder="Enter 9-Digit SSN ID" name="SSN_num" required>
            <div class="formerror" id="SSNError" style="color: red;"></div>
          </div>
          <div class="mb-3">
            <label for="exampleInputPassword1" class="form-label" style="font-weight: bold">Password</label>
            <input type="password" class="form-control" id="exampleInputPassword1" placeholder="Enter Password"
              name="exampleInputPassword1" required>
            <div class="formerror" id="PasswordError" style="color: red;"></div>
          </div>
          <button type="submit" class="btn btn-outline-success">Login</button>
        </form>
        <br></br>
        New to TrueBank? <a href="/signup">Create an account</a>
      </div>
      <div class="col-md-4"></div>

    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
    integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
    crossorigin="anonymous"></script>
  <script>
    function clearErrors() {
      const errors = document.getElementsByClassName('formerror');
      for (let item of errors) {
        item.innerHTML = "";
      }
    }

    function seterror(id, error) {
      document.getElementById(id).innerHTML = error;
    }

    function validateForm() {
      var returnval = true;
      clearErrors();

      //perform validation and if validation fails, set the value of returnval to false
      var SSN = document.forms['myForm']["SSN_num"].value;
      if (SSN.length != 9) {
        seterror("SSNError", "Length of SSN should be 9 digits");
        returnval = false;
      }

      return returnval;

    }

    document.getElementById('number').addEventListener('input', function () {
      if (this.value.length > 9) {
        this.value = this.value.slice(0, 9);
      }
    });
  </script>
</body>

</html>
